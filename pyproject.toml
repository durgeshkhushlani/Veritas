[project]
name = "veritas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "durgeshkhushlani", email = "beanonyfreak@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.26.0",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "tavily-python>=0.8.4",
    "trafilatura>=2.2.0",
]

[project.scripts]
veritas = "veritas:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
